services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_accountant
      POSTGRES_USER: ai_accountant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_accountant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_accountant:${POSTGRES_PASSWORD:-ai_accountant}@db:5432/ai_accountant
      DOCUMENT_STORAGE_PATH: data/private/documents
    volumes:
      - ./data/private/documents:/app/data/private/documents
    restart: "no"

volumes:
  postgres_data:

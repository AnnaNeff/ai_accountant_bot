services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_accountant
      POSTGRES_USER: ai_accountant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_accountant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accountant-bot"
version = "0.1.0"
description = "Personal Telegram bot skeleton for AI accountant."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "greenlet>=3.0,<4.0",
    "openai>=1.68,<2.0",
    "pillow>=10.0,<12.0",
    "pydantic-settings>=2.2,<3.0",
    "pytesseract>=0.3,<1.0",
    "PyYAML>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
